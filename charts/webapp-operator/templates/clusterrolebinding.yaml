{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "webapp-operator.fullname" . }}-binding
  labels:
    {{- include "webapp-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "webapp-operator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "webapp-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
