{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "webapp-operator.fullname" . }}-role
  labels:
    {{- include "webapp-operator.labels" . | nindent 4 }}
rules:
  # Webapp CRDs
  - apiGroups: ["webapp.io"]
    resources: ["websites", "websiterevisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["webapp.io"]
    resources: ["websites/status", "websiterevisions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["webapp.io"]
    resources: ["websites/finalizers", "websiterevisions/finalizers"]
    verbs: ["update"]

  # Ingress management
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Gateway discovery & active pod tracking
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # Image pull secrets resolution
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Events & Leader Election
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
