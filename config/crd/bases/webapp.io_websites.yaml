apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.webapp.io
spec:
  group: webapp.io
  names:
    kind: Website
    listKind: WebsiteList
    plural: websites
    singular: website
    shortNames:
      - web
      - sites
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Active Revision
          type: string
          jsonPath: .status.activeRevision
        - name: Active Image
          type: string
          jsonPath: .status.activeImage
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
                - hostnames
              properties:
                image:
                  type: string
                  description: OCI artifact reference containing static assets.
                hostnames:
                  type: array
                  items:
                    type: string
                  description: Hostnames routed to this website.
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Dynamic runtime environment variables.
                injection:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - endpoint
                        - inline
                        - both
                      default: endpoint
                    path:
                      type: string
                      default: "/_config.js"
                    versionPath:
                      type: string
                      default: "/_version"
                      description: URL path for the active version endpoint. Default is "/_version".
                    versionPolling:
                      type: boolean
                      default: true
                      description: Controls whether client apps automatically poll for new deployed versions.
                    pollIntervalSeconds:
                      type: integer
                      format: int32
                      default: 30
                      description: How often (in seconds) the frontend polls for new versions. Set to 0 to disable.
                imagePullSecrets:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                revisionHistoryLimit:
                  type: integer
                  format: int32
                  default: 3
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    className:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    tls:
                      type: array
                      items:
                        type: object
                        properties:
                          hosts:
                            type: array
                            items:
                              type: string
                          secretName:
                            type: string
                security:
                  type: object
                  description: HTTP security headers applied to responses served by this website.
                  properties:
                    preset:
                      type: string
                      enum:
                        - none
                        - standard
                        - strict
                    contentTypeOptions:
                      type: boolean
                    frameOptions:
                      type: string
                      enum:
                        - DENY
                        - SAMEORIGIN
                        - disabled
                    referrerPolicy:
                      type: string
                    coop:
                      type: string
                      enum:
                        - same-origin
                        - same-origin-allow-popups
                        - unsafe-none
                        - disabled
                    corp:
                      type: string
                      enum:
                        - same-origin
                        - same-site
                        - cross-origin
                        - disabled
                    coep:
                      type: string
                      enum:
                        - unsafe-none
                        - credentialless
                        - require-corp
                        - disabled
                    xssProtection:
                      type: boolean
                    hsts:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        maxAge:
                          type: integer
                          format: int32
                          default: 31536000
                        includeSubDomains:
                          type: boolean
                        preload:
                          type: boolean
                    permissionsPolicy:
                      type: object
                      properties:
                        camera:
                          type: array
                          items:
                            type: string
                        microphone:
                          type: array
                          items:
                            type: string
                        geolocation:
                          type: array
                          items:
                            type: string
                        payment:
                          type: array
                          items:
                            type: string
                        usb:
                          type: array
                          items:
                            type: string
                        fullscreen:
                          type: array
                          items:
                            type: string
                        displayCapture:
                          type: array
                          items:
                            type: string
                        extra:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                    csp:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        reportOnly:
                          type: boolean
                        raw:
                          type: string
                        directives:
                          type: object
                          properties:
                            defaultSrc:
                              type: array
                              items:
                                type: string
                            scriptSrc:
                              type: array
                              items:
                                type: string
                            styleSrc:
                              type: array
                              items:
                                type: string
                            imgSrc:
                              type: array
                              items:
                                type: string
                            connectSrc:
                              type: array
                              items:
                                type: string
                            fontSrc:
                              type: array
                              items:
                                type: string
                            objectSrc:
                              type: array
                              items:
                                type: string
                            mediaSrc:
                              type: array
                              items:
                                type: string
                            frameSrc:
                              type: array
                              items:
                                type: string
                            frameAncestors:
                              type: array
                              items:
                                type: string
                            baseUri:
                              type: array
                              items:
                                type: string
                            formAction:
                              type: array
                              items:
                                type: string
                            upgradeInsecureRequests:
                              type: boolean
                            reportUri:
                              type: string
                            extra:
                              type: object
                              additionalProperties:
                                type: array
                                items:
                                  type: string
                    customHeaders:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                activeRevision:
                  type: string
                activeImage:
                  type: string
                phase:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
